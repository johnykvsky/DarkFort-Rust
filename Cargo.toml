[package]
name = "dark-fort"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity"]
description = "Terminal ASCII roguelike adaptation of Dark Fort (2018)"

[dependencies]
crossterm = "0.28"
ratatui = "0.28"
rand = "0.8"
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
rand_chacha = "0.3"
